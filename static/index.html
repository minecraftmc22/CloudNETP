<!DOCTYPE html>

<head>

  <meta name="theme-color" content="#150f21">
  <title>CloudNETP · 樱色云盘</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/theme.css">

  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/views.css">
  <link rel="stylesheet" href="/static/css/files.css">
</head>

<!-- ============ Mica 背景 ============ -->
<div class="backdrop" aria-hidden="true">
  <div class="backdrop__blob blob-1"></div>
  <div class="backdrop__blob blob-2"></div>
  <div class="backdrop__blob blob-3"></div>
  <div class="backdrop__grain"></div>
</div>
<canvas id="petal-layer" class="petal-layer" aria-hidden="true"></canvas>

<!-- ============ 启动占位 ============ -->
<div id="boot" class="boot">
  <div class="spinner"></div>
</div>

<!-- ============ 登录 / 注册 ============ -->
<div id="auth-root" class="auth-root" hidden></div>

<!-- ============ 主界面 ============ -->
<div id="shell" class="app-shell" hidden>
  <header class="titlebar">
    <button id="nav-toggle" class="icon-btn" type="button" title="折叠导航" aria-label="折叠导航">
      <svg class="icon"><use href="#i-panel"/></svg>
    </button>
    <div class="titlebar__brand">
      <div class="brand__mark"><svg class="icon"><use href="#i-cloud"/></svg></div>
      <div class="brand__text">
        <span class="brand__name" id="brand-name">CloudNETP</span>
        <span class="brand__sub" id="brand-version">v0.1.4</span>
      </div>
    </div>
    <div class="titlebar__spacer"></div>
    <div class="titlebar__actions">
      <button id="theme-toggle" class="icon-btn" type="button" title="切换主题" aria-label="切换主题">
        <svg class="icon"><use href="#i-moon"/></svg>
      </button>
      <button id="user-chip" class="user-chip" type="button" aria-haspopup="menu">
        <span class="user-chip__avatar" id="user-avatar">?</span>
        <span class="user-chip__name" id="user-name">未登录</span>
      </button>
    </div>
  </header>

  <div class="app-body" id="app-body">
    <nav class="nav" id="nav" aria-label="主导航"></nav>
    <main class="view-root" id="view-root"></main>
  </div>
</div>

    <circle cx="99" cy="62" r="2" fill="#fbcfe8" opacity="0.85"/>
  </svg>
</div>

<div id="dialog-host" class="dialog-host" role="presentation"></div>
<div id="toast-host" class="toast-host" aria-live="polite"></div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
