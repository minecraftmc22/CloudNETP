<!-- ============ Mica 背景 ============ -->
<div class="backdrop" aria-hidden="true">
  <div class="backdrop__blob blob-1"></div>
  <div class="backdrop__blob blob-2"></div>
  <div class="backdrop__blob blob-3"></div>
  <div class="backdrop__grain"></div>
</div>
<canvas id="petal-layer" class="petal-layer" aria-hidden="true"></canvas>

<!-- ============ 启动占位 ============ -->
<div id="boot" class="boot">
  <div class="spinner"></div>
</div>

<!-- ============ 登录 / 注册 ============ -->
<div id="auth-root" class="auth-root" hidden></div>

<!-- ============ 主界面 ============ -->
<div id="shell" class="app-shell" hidden>
  <header class="titlebar">
    <button id="nav-toggle" class="icon-btn" type="button" data-i18n-title="折叠导航" data-i18n-aria="折叠导航">
      <svg class="icon"><use href="#i-panel"/></svg>
    </button>
    <div class="titlebar__brand">
      <div class="brand__mark"><img src="/assets/brand-avatar.png" alt="" width="26" height="26"></div>
      <div class="brand__text">
        <span class="brand__name" id="brand-name">CloudNETP</span>
        <span class="brand__sub" id="brand-version">v0.3.2</span>
      </div>
    </div>
    <div class="titlebar__spacer"></div>
    <div class="titlebar__actions">
      <div id="email-tip" class="email-tip" hidden>
        <button class="email-tip__main" type="button" data-email-go>
          <svg class="icon icon--s"><use href="#i-mail"/></svg>
          <span data-i18n="未绑定邮箱，请尽快绑定">未绑定邮箱，请尽快绑定</span>
        </button>
        <button class="email-tip__close" type="button" data-email-dismiss data-i18n-aria="不再提示" data-i18n-title="不再提示">
          <svg class="icon icon--s"><use href="#i-close"/></svg>
        </button>
      </div>
      <button id="theme-toggle" class="icon-btn" type="button" data-i18n-title="切换主题" data-i18n-aria="切换主题">
        <svg class="icon"><use href="#i-moon"/></svg>
      </button>
      <button id="user-chip" class="user-chip" type="button" aria-haspopup="menu" data-i18n-aria="个人菜单">
        <span class="user-chip__avatar" id="user-avatar">?</span>
        <span class="user-chip__name" id="user-name">未登录</span>
      </button>
    </div>
  </header>

  <div class="app-body" id="app-body">
    <nav class="nav" id="nav" data-i18n-aria="主导航"></nav>
    <main class="view-root" id="view-root"></main>
  </div>
</div>

<!-- ============ 看板娘（Live2D，模型来自 /live2d/model；没有模型时退回云朵） ============ -->
<div id="mascot" class="mascot" role="complementary" data-i18n-aria="看板娘">

  <div class="mascot__stage" id="mascot-stage">
  <svg class="mascot__cloud" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="mg-body" x1="24" y1="30" x2="100" y2="96" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="0.5" stop-color="#fdf3ff"/>
        <stop offset="1" stop-color="#f1e0ff"/>
      </linearGradient>
      <linearGradient id="mg-star" x1="88" y1="34" x2="104" y2="50" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fbcfe8"/>
        <stop offset="1" stop-color="#f9a8d4"/>
      </linearGradient>
      <radialGradient id="mg-glow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#e9d5ff" stop-opacity="0.9"/>
        <stop offset="1" stop-color="#e9d5ff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <ellipse cx="60" cy="44" rx="52" ry="42" fill="url(#mg-glow)" opacity="0.55"/>
    <ellipse cx="60" cy="105" rx="27" ry="4.6" fill="#8b5cf6" opacity="0.14"/>

          fill="url(#mg-body)" stroke="#e4cdfa" stroke-width="1.6" stroke-linejoin="round"/>

    <path d="M60 35c-.6-6.2 3.4-10 8.4-9.4" stroke="#d8b4fe" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="70.4" cy="24.6" r="2.6" fill="#f9a8d4"/>
    <ellipse cx="36.5" cy="80.5" rx="6.2" ry="3.2" fill="#ffb3d1" opacity="0.7"/>
    <ellipse cx="82.5" cy="80.5" rx="6.2" ry="3.2" fill="#ffb3d1" opacity="0.7"/>
    <ellipse cx="47.5" cy="72" rx="4.1" ry="4.5" fill="#43305e"/>
    <ellipse cx="71.5" cy="72" rx="4.1" ry="4.5" fill="#43305e"/>
    <circle cx="48.9" cy="70.3" r="1.5" fill="#ffffff"/>
    <circle cx="72.9" cy="70.3" r="1.5" fill="#ffffff"/>
    <path d="M55.6 79.4c1.6 2 3.2 2.9 4.4 2.9s2.8-.9 4.4-2.9" stroke="#43305e" stroke-width="2" stroke-linecap="round"/>
    <path d="M92 33.2l2.3 6.5 6.5 2.3-6.5 2.3-2.3 6.5-2.3-6.5-6.5-2.3 6.5-2.3Z" fill="url(#mg-star)"/>
    <path d="M26 44.5l1.3 3.4 3.4 1.3-3.4 1.3-1.3 3.4-1.3-3.4-3.4-1.3 3.4-1.3Z" fill="#ddd6fe" opacity="0.9"/>
    <circle cx="99" cy="62" r="2" fill="#fbcfe8" opacity="0.85"/>
  </svg>
  </div>
  <button class="mascot__pick" id="mascot-pick" type="button" hidden data-i18n-title="切换到下一个模型">
    <svg class="icon icon--s"><use href="#i-refresh"/></svg>
    <span id="mascot-pick-label" data-i18n="换一个">换一个</span>
  </button>
  <!-- 悬停才出现的操作条：锁定（鼠标穿透）/ 对话 / 关闭 -->
  <div class="mascot__actions" id="mascot-actions">
    <button class="mascot__act" type="button" data-mascot-act="lock" data-i18n-title="锁定后鼠标可以穿过看板娘，点到底下的文件">
      <svg class="icon icon--s"><use href="#i-lock"/></svg><span data-label data-i18n="锁定">锁定</span>
    </button>
    <button class="mascot__act" type="button" data-mascot-act="chat" data-i18n-title="和 CDP娘 聊两句">
      <svg class="icon icon--s"><use href="#i-chat"/></svg><span data-label data-i18n="对话">对话</span>
    </button>
    <button class="mascot__act" type="button" data-mascot-act="close" data-i18n-title="暂时收起看板娘（可在设置里打开）">
      <svg class="icon icon--s"><use href="#i-close"/></svg><span data-label data-i18n="关闭">关闭</span>
    </button>
  </div>
</div>

<div id="dialog-host" class="dialog-host" role="presentation"></div>
<div id="toast-host" class="toast-host" aria-live="polite"></div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
