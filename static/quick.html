<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf4fa">
  <meta name="version" content="0.3.70">
  <title>快传 · CloudNETP</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CloudNETP">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/share.css">
  <link rel="stylesheet" href="/static/css/quick.css">
  <link rel="stylesheet" href="/static/css/mobile.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.2 3.4 6.6 13.2h4.4l-.8 7.4 6.9-9.9h-4.5Z"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16.5v-8"/><path d="m8.6 11.7 3.4-3.4 3.4 3.4"/><path d="M7 18.8h10"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 5v9"/><path d="m8.6 10.7 3.4 3.4 3.4-3.4"/><path d="M5 19h14"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3.8h7.2L18.6 9v11.2H6Z"/><path d="M13 3.9V9.2h5.4"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.6A2.6 2.6 0 0 1 6.1 5h2.7c.66 0 1.29.26 1.76.72l1.1 1.1h6.24A2.6 2.6 0 0 1 20.5 9.4v7A2.6 2.6 0 0 1 17.9 19H6.1a2.6 2.6 0 0 1-2.6-2.6Z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.6 4.4 4.4L19 6.6"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.8v5.4"/><path d="M12 16.2h.01"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.4 6.4 11.2 11.2M17.6 6.4 6.4 17.6"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.2 18.5h9.9a4.3 4.3 0 0 0 .5-8.57A6.2 6.2 0 0 0 6.1 9.9a4.32 4.32 0 0 0 1.1 8.6Z"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5.4" y="10.2" width="13.2" height="9" rx="2.2"/><path d="M8.6 10.2V8a3.4 3.4 0 0 1 6.8 0v2.2"/></symbol>
      <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M8 16 16 8"/><path d="M9.4 8H16v6.6"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6 8.5 12l6 6"/></symbol>
    </defs>
  </svg>

  <div class="share-page">
    <header class="share-brand">
      <div class="share-brand__id">
        <img class="share-brand__mark" src="/assets/brand-avatar.png" alt="" width="24" height="24">
        <span data-brand>CloudNETP</span>
      </div>
      <div class="share-auth" data-auth hidden></div>
    </header>

    <main class="share-main" id="quick-root">
      <section class="share-card">
        <div class="share-skeleton"><span class="spinner"></span><span data-i18n="正在准备快传…">正在准备快传…</span></div>
      </section>
    </main>

    <footer class="share-foot" data-i18n="由 CloudNETP 提供快传服务">由 CloudNETP 提供快传服务</footer>
  </div>

  <script type="module" src="/static/js/quick-public.js"></script>
</body>
</html>
