  <div class="share-page">
    <header class="share-brand">
      <div class="share-brand__id">
        <img class="share-brand__mark" src="/assets/brand-avatar.png" alt="" width="24" height="24">
        <span data-brand>CloudNETP</span>
      </div>
      <!-- 登录态：未登录给「登录 / 注册」，登录了显示是谁在看 -->
      <div class="share-auth" data-auth hidden></div>
    </header>

    <main class="share-main" id="share-root">
      <section class="share-card">
        <div class="share-skeleton"><span class="spinner"></span><span data-i18n="正在打开分享…">正在打开分享…</span></div>
      </section>
    </main>

    <footer class="share-foot" data-i18n="由 CloudNETP 提供分享服务">由 CloudNETP 提供分享服务</footer>
